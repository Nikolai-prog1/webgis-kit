services:
  db:
    image: postgis/postgis:17-3.7
    environment:
      POSTGRES_DB: webgis
      POSTGRES_USER: webgis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webgis -d webgis']
      interval: 5s
      timeout: 5s
      retries: 20
  geoserver:
    image: docker.osgeo.org/geoserver:2.28.6
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?Set GEOSERVER_ADMIN_PASSWORD in your local environment}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - geoserver:/opt/geoserver_data
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  geoserver:
