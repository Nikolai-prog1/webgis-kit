name: Bug report
description: Describe reproducible template behavior
body:
  - type: textarea
    id: problem
    attributes:
      label: What happens and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and a synthetic configuration
      description: Remove private addresses, credentials and real service responses.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Browser, version and validation results
